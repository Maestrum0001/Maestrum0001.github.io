<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FireWatch</title>
    <link rel="icon" type="image/x-icon" href="firewatch icon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1>Firewatch Dashboard</h1>
        <select id="deviceSelector"></select>
    </div>
    <div id="alertBanner" style="display:none;"></div>

    <!-- Dashboard Layout -->
    <div class="unit">
        <div class="sensor-grid">

            <!--Internal Temp-->
            <div class="gauge" id="internalTempGauge">
                <span class="label">Internal Temp</span>
                <div class="circle">
                    <span class="value" id="internalTempValue">--°C</span>
                </div>
            </div>

            <!--External Temp-->
            <div class="gauge" id="externalTempGauge">
                <span class="label">External Temp</span>
                <div class="circle">
                    <span class="value" id="externalTempValue">--°C</span>
                </div>
            </div>

            <!--Internal Humidity-->
            <div class="humidity" id="internalHumidityBox">
                <span class="label">Internal Humidity</span>
                <div class="vertical-bar">
                    <div class="vertical-fill" id="internalHumidityFill"></div>
                </div>
                <span class="humidity-value" id="internalHumidityValue">--%</span>
            </div>

            <!--External Humidity-->
            <div class="humidity" id="externalHumidityBox">
                <span class="label">External Humidity</span>
                <div class="vertical-bar">
                    <div class="vertical-fill" id="externalHumidityFill"></div>
                </div>
                <span class="humidity-value" id="externalHumidityValue">--%</span>
            </div>

            <!--Mems suite-->
            <div class="sensor" id="smoke">Smoke: --</div>
            <div class="sensor" id="voc">VOC: --</div>
            <div class="sensor" id="methane">Methane: --</div>
            <div class="sensor" id="co">CO: --</div>

        </div>
    </div>

</div>

<div id="bottom-row">
    <!-- Unit Camera Picture-->
    <div id="unit-photo-container">
        <img id="unitPhoto" src="" alt="Camera Image" />
    </div>

    <div id="map"></div>

    <!-- Email Alert Signup -->
    <div id="email-signup">
        <h3>Get FireWatch Alerts via Email</h3>
        <input type="email" id="email" placeholder="you@example.com" />
        <button onclick="subscribe()">Subscribe</button>
        <p id="status"></p>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

<script>
// ─── Dashboard ───────────────────────────────────────────────────────────────

const devices = {
    "Unit 1": "device1",
    "Unit 2": "device2",
    "Unit 3": "device3"
};

const thresholds = {
    smoke: 1.0,
    voc: 0.75,
    methane: 1.0,
    co: 1.2,
    temp: 40.0
};

const selector = document.getElementById("deviceSelector");

Object.keys(devices).forEach(name => {
    const option = document.createElement("option");
    option.value = devices[name];
    option.textContent = name;
    selector.appendChild(option);
});

function sensorMalfunction(data) {
    let issues = [];

    const sensorsToCheck = ["smoke", "voc", "methane", "co"];

    sensorsToCheck.forEach(key => {
        if (data[key] <= 0) {
            issues.push(`${key.toUpperCase()} IS NON-POSITIVE`);
        }
        if (data[key] > 3.3) {
            issues.push(`${key.toUpperCase()} EXCEEDS SENSOR RANGE`);
        }
    });

    if (data.internalTemp < -40 || data.internalTemp > 85) {
        issues.push("INTERNAL TEMPERATURE OUT OF RANGE");
    }
    if (data.externalTemp < -40 || data.externalTemp > 85) {
        issues.push("EXTERNAL TEMPERATURE OUT OF RANGE");
    }

    if (data.internalHumidity < 0 || data.internalHumidity > 100) {
        issues.push("INTERNAL HUMIDITY OUT OF RANGE");
    }
    if (data.externalHumidity < 0 || data.externalHumidity > 100) {
        issues.push("EXTERNAL HUMIDITY OUT OF RANGE");
    }

    return issues;
}

function loadDeviceData(deviceId) {
    const apiUrl = `https://vu0v9n00ng.execute-api.us-east-1.amazonaws.com/sensors/${deviceId}`;
    
    fetch(apiUrl)
        .then(res => {
            console.log("STATUS:", res.status);
            return res.json();
        })
        .then(data => {
            console.log("DATA:", data);

            if (data.internalTemp === undefined) {
                console.error("Bad response from API:", data);
                return;
            }

            // Temperature values
            updateGauge("internalTempGauge", data.internalTemp);
            updateGauge("externalTempGauge", data.externalTemp);

            document.getElementById("internalTempValue").textContent = data.internalTemp.toFixed(2) + "°C";
            document.getElementById("externalTempValue").textContent = data.externalTemp.toFixed(2) + "°C";

            // Humidity values
            document.getElementById("internalHumidityFill").style.height = data.internalHumidity.toFixed(2) + "%";
            document.getElementById("externalHumidityFill").style.height = data.externalHumidity.toFixed(2) + "%";

            document.getElementById("internalHumidityValue").textContent = data.internalHumidity.toFixed(2) + "%";
            document.getElementById("externalHumidityValue").textContent = data.externalHumidity.toFixed(2) + "%";

            // Mems suite values
            document.getElementById("smoke").textContent = `Smoke: ${data.smoke.toFixed(2)}`;
            document.getElementById("voc").textContent = `VOC: ${data.voc.toFixed(2)}`;
            document.getElementById("methane").textContent = `Methane: ${data.methane.toFixed(2)}`;
            document.getElementById("co").textContent = `CO: ${data.co.toFixed(2)}`;

            // picture display
            const img = document.getElementById("unitPhoto");
            const imageUrl = data.S3_Address;
            if (imageUrl) {
                img.style.display = "block";
                img.src = imageUrl;
            } else {
                img.src = "";
            }

            const banner = document.getElementById("alertBanner");

            document.body.classList.remove("alert-active");
            banner.style.display = "none";
            banner.textContent = "";

            let triggered = [];

            if (data.smoke > thresholds.smoke) triggered.push("Smoke");
            if (data.voc > thresholds.voc) triggered.push("VOC");
            if (data.methane > thresholds.methane) triggered.push("Methane");
            if (data.co > thresholds.co) triggered.push("CO");
            if (data.internalTemp > thresholds.temp || data.externalTemp > thresholds.temp) {
                triggered.push("High Temperature");
            }

            if (data.fire_bool) {
                document.body.classList.add("alert-active");
                banner.style.display = "block";

                let sensorText = triggered.length > 0
                    ? ` Triggered sensors: ${triggered.join(", ")}`
                    : "";

                banner.textContent = "ALERT: A POTENTIAL FIRE HAS BEEN DETECTED AT THIS UNIT. MONITOR SURROUNDINGS AND CONTACT LOCAL FIRE DEPARTMENT." + sensorText;
            }

            else if (data.tamper_bool === true) {
                document.body.classList.add("alert-active");
                banner.style.display = "block";
                banner.textContent = "ALERT: POTENTIAL TAMPERING HAS BEEN DETECTED AT THIS UNIT. VALIDATE SYSTEM STATUS AND REFER TO LOCATION INFORMATION.";
            }

            let malfunctionIssues = sensorMalfunction(data);

            if (malfunctionIssues.length > 0) {
                document.body.classList.add("alert-active");
                banner.style.display = "block";

                banner.textContent = 
                    "SENSOR MALFUNCTION DETECTED: " + malfunctionIssues.join(", ");
            }

            if (data.latitude && data.longitude) {
                const lat = data.latitude;
                const lng = data.longitude;

                if (lat && lng) {

                    if (!window.map) {
                        window.map = L.map('map').setView([lat, lng], 13);

                        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            maxZoom: 19,
                            attribution: '&copy; OpenStreetMap'
                        }).addTo(window.map);

                        window.marker = L.marker([lat, lng]).addTo(window.map);

                        const googleMapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;

                        window.marker.on("click", () => {
                            window.open(googleMapsUrl, "_blank");
                        });

                    } else {

                        window.map.setView([lat, lng], 13);
                        window.marker.setLatLng([lat, lng]);

                        const googleMapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;

                        window.marker.off("click"); // prevent stacking old listeners
                        window.marker.on("click", () => {
                            window.open(googleMapsUrl, "_blank");
                        });
                    }
                }
            }

            console.log("FULL DATA:", data);
        })
        .catch(err => {
            console.error("FETCH ERROR:", err);
        });
}

// Dropdown change handler
selector.addEventListener("change", () => {
    loadDeviceData(selector.value);
});

// Init load
loadDeviceData(selector.value);

// Auto-refresh every 5 seconds
setInterval(() => {
    loadDeviceData(selector.value);
}, 5000);

function updateGauge(id, temp) {
    const circle = document.querySelector(`#${id} .circle`);
    const min = 0;
    const max = 54.4;
    let percentage = ((temp - min) / (max - min)) * 100;

    let color;
    if (temp > max) {
        color = "red";
        percentage = 100;
    } else if (temp > 37.7) {
        color = "orange";
    } else if (temp < min) {
        color = "blue";
        percentage = 0;
    } else {
        color = "#4e73df";
    }

    circle.style.background =
        `conic-gradient(${color} ${percentage}%, #e6e6e6 ${percentage}%)`;
}

// Map
var map = L.map('map').setView([33.2539308391646, -97.15267820552333], 13); //CHANGE COORDINATES WHEN LONG AND LAT ARE READY
var marker = L.marker([33.2539308391646, -97.15267820552333]).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

// ─── Email Signup ─────────────────────────────────────────────────────────────

async function subscribe() {
    const email = document.getElementById('email').value;
    const status = document.getElementById('status');

    if (!email) {
        status.textContent = '❌ Please enter an email address.';
        return;
    }

    status.textContent = 'Subscribing...';

    try {
        const res = await fetch('https://vu0v9n00ng.execute-api.us-east-1.amazonaws.com/sensors/emailAlerts', {
            method: 'POST',
            //headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        status.textContent = res.ok
            ? '✅ Check your inbox to confirm your subscription!'
            : '❌ Error: ' + data.message;
    } catch (err) {
        status.textContent = '❌ Network error. Please try again.';
    }
}
</script>

</body>
</html>
